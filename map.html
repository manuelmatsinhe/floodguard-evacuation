<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map | FloodGuard Evacuation</title>
  <meta name="description" content="Evacuation Map for FloodGuard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo">
        <h1><span class="material-symbols-outlined" style="vertical-align: bottom; font-size: inherit;">water</span> FloodGuard</h1>
      </div>
      <div class="menu-container" style="display: flex; align-items: center;">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme"><span class="material-symbols-outlined">dark_mode</span></button>
        <button class="hamburger" aria-label="Toggle menu" id="hamburger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="main-nav" id="main-nav">
          <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="map.html" class="active">Evacuation Map</a></li>
            <li><a href="alerts.html">Alerts</a></li>
            <li><a href="shelters.html">Shelters</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <section class="map-section" id="map">
        <div class="map-header">
          <h2>Evacuation Map</h2>
          <p>Real-time view of safe zones, shelters, and flooded areas.</p>
        </div>
        
        <div class="route-controls">
          <button class="btn-primary" id="btn-calc-route" style="display: inline-flex; align-items: center; gap: 8px;">
            <span class="material-symbols-outlined">directions</span> Calculate Route to Nearest Safehold
          </button>
          <div id="route-result" class="route-result" hidden>
            <!-- Route feedback goes here -->
          </div>
        </div>

        <div class="map-container">
          <iframe 
            src="https://www.openstreetmap.org/export/embed.html?bbox=-9.2435%2C38.6946%2C-9.0988%2C38.7538&amp;layer=mapnik" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
          </iframe>
          <div class="map-overlay">
            <span class="badge badge-safe">Shelter A (Safe)</span>
            <span class="badge badge-danger">Sector A (Danger)</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 FloodGuard Evacuation. All rights reserved.</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
